<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela De Login</title>
    <link rel="stylesheet" href="../css/Login.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'rel='stylesheet'>      <!-- aqui estou iportando icones do site unpkg -->
    <script src="../scripts/Login.js"></script>

</head>
<body>



    <main class="container">

    <h1 id="titulo">Tela de login</h1>


     <!-- aqui entrara os input box de usuario e senha  -->
    <div class="input-box">
        <input placeholder="Digite seu usuário" type="email" id="usuario">
        <i class='bx bxs-user'></i>
    </div>

    <div class="input-box">
        <input placeholder="Digite sua senha" type="password" id="senha">
        <i class='bx bxs-lock-alt'></i>
    </div>

    <div class="remember-forgot">  
        <label><input type="checkbox">
            Lembrar Senha   
        </label>
        <a href="#">Esqueci a senha</a>    <!-- não temos ainda um metodo de recuperação --> 
    </div>

     <!-- botão de logar -->
        <button type="submit"  class="entrar" id="logar"  onclick="logar()">Entrar</button > 

    </form>
    </main>

    
    
</body>
</html>
