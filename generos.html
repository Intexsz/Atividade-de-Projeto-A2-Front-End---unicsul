<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gêneros — Projeto Fênix</title>
    <meta name="description" content="Explore o catálogo do Projeto Fênix por gênero. As quantidades vêm direto da base de dados.">
    <meta name="theme-color" content="#0D0D0D">
    <link rel="icon" href="assets/icons/Projeto Fênix - Emblema.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages/generos.css">
    <script type="module" src="assets/js/main.js"></script>
    <script type="module" src="assets/js/pages/generos.js"></script>
</head>

<body data-page="generos">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div class="bg-glow" aria-hidden="true"></div>
    <canvas id="ember-canvas" class="ember-canvas" aria-hidden="true" hidden></canvas>

    <header id="site-header" class="site-header"></header>

    <main id="main" tabindex="-1">
        <noscript>
            <p class="noscript">O Projeto Fênix precisa de JavaScript para montar o catálogo. Ative o JavaScript no navegador e recarregue a página.</p>
        </noscript>

        <section class="page-hero" aria-labelledby="page-title">
            <div class="container-wide page-hero__inner">
                <nav aria-label="Trilha de navegação">
                    <ol class="crumbs">
                        <li><a href="index.html">Início</a></li>
                        <li aria-current="page">Gêneros</li>
                    </ol>
                </nav>
                <h1 class="page-hero__title" id="page-title">Gêneros</h1>
                <p class="page-hero__desc">Descubra jogos por categoria. As quantidades são calculadas a partir do catálogo e se atualizam sozinhas.</p>
                <ul class="stat-pills" data-slot="stats" aria-label="Números do catálogo"></ul>
            </div>
        </section>

        <section class="section genres-section" aria-labelledby="genres-title">
            <div class="container-wide">
                <header class="section-head">
                    <div class="section-head__text">
                        <h2 class="title-hud" id="genres-title">Escolha um gênero</h2>
                        <p class="section-head__desc">Selecione um card para ver os jogos do gênero logo abaixo, com filtros por plataforma e controles aceitos.</p>
                    </div>
                </header>
                <div class="genre-tools" data-slot="tools"></div>
                <div data-slot="genres"></div>
            </div>
        </section>

        <section class="genre-panel" id="genre-panel" data-slot="panel" aria-labelledby="genre-panel-title" hidden>
        </section>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
